name: CobaltRoute release validation

# The upstream OmniRoute release-green workflow assumes OmniRoute's release
# branches, AGENTS.md policy, issue tracker, runner variables, and release
# ratchets. Those assumptions do not match CobaltRoute, so automatic execution
# is disabled instead of producing false-red notifications.
# Built by Cobalt.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notice:
    name: Upstream release-green disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain validation state
        run: |
          echo "Inherited OmniRoute Release-Green automation is intentionally disabled in CobaltRoute."
          echo "Use CobaltRoute-specific tests, typechecks, and lint validation for feature work."
          echo "Built by Cobalt."
