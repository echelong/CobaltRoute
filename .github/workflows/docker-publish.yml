name: CobaltRoute container publishing

# CobaltRoute does not publish the upstream OmniRoute Docker images.
# Keep this workflow manual-only until CobaltRoute has its own registry names
# and credentials. This prevents fork pushes from failing on upstream secrets.
# Built by Cobalt.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notice:
    name: Publishing disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain publishing state
        run: |
          echo "Inherited OmniRoute Docker publishing is intentionally disabled in CobaltRoute."
          echo "Configure CobaltRoute-owned image names and registry credentials before enabling automated publishing."
          echo "Built by Cobalt."
